name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias aygun \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass aygun123 -keypass aygun123 \
            -dname "CN=Aygün Müəllim, OU=LMS, O=Aygün Müəllim, L=Baku, C=AZ"

      - name: Build signed APK
        run: |
          export KEYSTORE_PATH=${{ github.workspace }}/release.keystore
          export KEYSTORE_PASSWORD=aygun123
          export KEY_ALIAS=aygun
          export KEY_PASSWORD=aygun123
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aygün-Müəllim-APK
          path: app/build/outputs/apk/release/*.apk
